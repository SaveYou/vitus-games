<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch Animation Movies</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #112244; 
            font-family: 'Arial Black', sans-serif;
            box-sizing: border-box;
        }
        .wrapper {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 950px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title {
            font-size: 32px;
            color: #112244;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }
        .highlight-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background-color: #00d2ff; 
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 0 #009ec2;
            transition: all 0.1s ease;
            text-align: center;
        }
        .back-button:hover { background-color: #40dfff; }
        .back-button:active { transform: translateY(4px); box-shadow: none; }

        @media (max-width: 768px) {
            .video-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="page-title">Overwatch Animation Movies</h1>

        <div class="video-grid">
            
            <!-- Video 1: Bastion Short -->
            <iframe src="https://youtube.com" title="The Last Bastion" allowfullscreen class="highlight-video"></iframe>

            <!-- Video 2: Winston Recall Short -->
            <iframe src="https://youtube.com" title="Recall" allowfullscreen class="highlight-video"></iframe>

            <!-- Video 3: Dragons Short -->
            <iframe src="https://youtube.com" title="Dragons" allowfullscreen class="highlight-video"></iframe>

            <!-- Video 4: McCree Reunion Short -->
            <iframe src="https://youtube.com" title="Reunion" allowfullscreen class="highlight-video"></iframe>

            <!-- Video 5: Reinhardt Honor Short -->
            <iframe src="https://youtube.com" title="Honor and Glory" allowfullscreen class="highlight-video"></iframe>

            <!-- Video 6: Kiriko Short -->
            <iframe src="https://youtube.com" title="Kiriko" allowfullscreen class="highlight-video"></iframe>

        </div>

        <a href="index.html" class="back-button">Zurück zur Startseite</a>
    </div>

</body>
</html>
