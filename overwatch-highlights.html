<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch Video Highlights</title>
    <style>
        /* Exakt derselbe Hintergrund wie auf der Startseite */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #112244; 
            font-family: 'Arial Black', sans-serif;
            box-sizing: border-box;
        }

        /* Der weiße Kasten passt sich flexibel der Höhe der Videos an */
        .wrapper {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 950px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Titel für den Highlight-Bereich */
        .page-title {
            font-size: 32px;
            color: #112244;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Das Grid-Layout für die 6 Videos (2 Spalten) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Sorgt für perfekte Symmetrie im 16:9 Format für jedes Video */
        .highlight-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Zurück-Button zur Hauptseite */
        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background-color: #00d2ff; /* Schickes Gaming-Hellblau */
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 0 #009ec2;
            transition: all 0.1s ease;
            text-align: center;
        }

        .back-button:hover {
            background-color: #40dfff;
        }

        .back-button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Responsive Design für kleinere Bildschirme / Handys */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="page-title">Overwatch Video Highlights</h1>

        <!-- Das Grid mit allen 6 echten Videos -->
        <div class="video-grid">
            
            <!-- Video 1: Bastion Short -->
            <video controls class="highlight-video">
                <source src="overwatch-bastion-short.mp4" type="video/mp4">
            </video>

            <!-- Video 2: Winston Recall Short -->
            <video controls class="highlight-video">
                <source src="overwatch-winston-recall.mp4" type="video/mp4">
            </video>

            <!-- Video 3: Dragons Short -->
            <video controls class="highlight-video">
                <source src="overwatch-dragons-short.mp4" type="video/mp4">
            </video>

            <!-- Video 4: McCree Reunion Short -->
            <video controls class="highlight-video">
                <source src="overwatch-mccree-reunion.mp4" type="video/mp4">
            </video>

            <!-- Video 5: Reinhardt Honor and Glory Short -->
            <video controls class="highlight-video">
                <source src="overwatch-reinhardt-honor.mp4" type="video/mp4">
            </video>

            <!-- Video 6: Kiriko Short -->
            <video controls class="highlight-video">
                <source src="overwatch-kiriko-short.mp4" type="video/mp4">
            </video>

        </div>

        <!-- Zurück-Button auf die index.html -->
        <a href="index.html" class="back-button">Zurück zur Startseite</a>
    </div>

</body>
</html>
