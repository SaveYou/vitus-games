<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch Game-Infos</title>
    <style>
        /* Zentriert den Kasten perfekt auf dem Bildschirm */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #112244; /* Dasselbe coole Dunkelblau wie auf der Hauptseite */
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        /* Der Kasten – exakt dieselbe Größe wie der Hauptkasten auf index.html */
        .empty-info-box {
            max-width: 950px;
            width: 100%;
            height: 500px;
            background-color: #ffffff;
            border: 5px solid #000000;
            border-radius: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Styling für die geheime Botschaft an deine Oma */
        .oma-text {
            color: #000000;
            font-size: 38px;
            text-align: center;
            line-height: 1.4;
            margin: 0;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Der zentrierte Kasten mit deiner lieben Botschaft und den Herzen -->
    <div class="empty-info-box">
        <p class="oma-text">Ich hab euch lieb !!! Ihr seid die besten Eltern auf der Welt!!! ❤️❤️❤️</p>
    </div>

</body>
</html>
